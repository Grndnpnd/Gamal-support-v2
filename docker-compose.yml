# The whole stack on one machine, for building and testing beside production. Never with the production Discord
# token while production is running: two copies of one bot both answer every message. Use the test bot's token.
#   cp example.env.example .env   (fill in the TEST bot's values)   then   docker compose up --build
# Postgres and Redis are reachable only from the other containers; nothing but the api and the webhook has a port.
services:
  bot:
    build: .
    command: python entrypoint.py bot.py
    env_file: .env
    environment: &stores
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://support:support@postgres:5432/support
      WEBHOOK_SERVER_URL: http://webhook:8080
    depends_on: [postgres, redis]
    restart: unless-stopped
  api:
    build: .
    command: python entrypoint.py api_server.py
    env_file: .env
    environment: *stores
    ports: ["127.0.0.1:8000:8000"]
    depends_on: [postgres, redis]
    restart: unless-stopped
  webhook:
    build: .
    command: python entrypoint.py webhook_server.py
    env_file: .env
    environment: *stores
    ports: ["127.0.0.1:8080:8080"]
    depends_on: [redis]
    restart: unless-stopped
  postgres:
    image: postgres:17
    environment: { POSTGRES_USER: support, POSTGRES_PASSWORD: support, POSTGRES_DB: support }
    volumes: ["pgdata:/var/lib/postgresql/data"]
  redis:
    # Valkey 8: the same engine and version the managed cache on AWS runs (aws/stack.yaml in support-migration).
    image: valkey/valkey:8
    command: ["valkey-server", "--appendonly", "yes"]
    volumes: ["redisdata:/data"]
volumes:
  pgdata:
  redisdata:
